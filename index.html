<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Киіз үй фразеологияда</title>
<style>
:root{--bg:#f4f1ea;--ink:#1f2430;--muted:#5d6472;--nav:#16244a;--accent:#2b5fd9;--card:#ffffffee;--gold:#e0a325;--red:#9b1c1c;--line:#d9d3c6}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,"Segoe UI",Roboto,sans-serif}
header{height:64px;display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--nav);color:#fff}
.brand{font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-weight:400;opacity:.7;font-size:12px}
nav{margin-left:auto;display:flex;gap:6px}
nav button{background:transparent;color:#fff;border:0;border-radius:10px;padding:8px 14px;font:inherit;font-size:15px;cursor:pointer}
nav button.on{background:var(--accent)}
.langs{display:flex;gap:2px;background:#ffffff1a;border-radius:10px;padding:3px}
.langs button{background:transparent;color:#fff;border:0;border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.langs button.on{background:var(--gold);color:#1f1a0a}
main{height:calc(100% - 64px);position:relative}
.page{display:none;height:100%;overflow:auto}
.page.on{display:block}
#model{position:relative;overflow:hidden}
#c{width:100%;height:100%;display:block;touch-action:none}
.views{position:absolute;top:14px;left:14px;display:flex;gap:8px}
.pill{border:0;border-radius:999px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer;background:#16244a;color:#fff;box-shadow:0 2px 8px #0003}
.pill.on{background:var(--gold);color:#1f1a0a}
.bar{position:absolute;left:14px;bottom:14px;display:flex;gap:8px;flex-wrap:wrap;max-width:calc(100% - 28px)}
.bar button{border:0;border-radius:999px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer;background:#16244aee;color:#fff;box-shadow:0 2px 8px #0003}
.bar button.on{background:var(--accent)}
.bar button.vr{background:#2b5fd9}
.parts{position:absolute;top:66px;left:14px;display:flex;flex-direction:column;gap:6px}
.parts button{border:1px solid #fff8;border-radius:10px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer;background:#ffffffcc;color:var(--ink);text-align:left}
.parts button.on{background:var(--gold);border-color:var(--gold)}
.hint{position:absolute;top:18px;right:16px;background:#0006;color:#fff;padding:6px 12px;border-radius:999px;font-size:13px}
.credit{position:absolute;right:16px;top:56px;max-width:400px;background:#16244add;color:#fff;padding:8px 14px;border-radius:12px;font-size:13px;text-align:right}
#VRButton{top:14px!important;bottom:auto!important;background:#2b5fd9!important;border:0!important;font-weight:700!important;opacity:1!important}
#toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:#16244aee;color:#fff;padding:10px 18px;border-radius:12px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center}
#toast.show{opacity:1}
#info{position:absolute;top:60px;right:14px;bottom:80px;width:min(400px,calc(100% - 28px));background:var(--card);backdrop-filter:blur(6px);border-radius:16px;box-shadow:0 6px 24px #0003;padding:18px 20px;overflow:auto;transition:transform .3s,opacity .3s}
#info.hidden{opacity:0;transform:translateX(30px);pointer-events:none}
#info h2{margin:0;font-size:26px}
#info .lat{color:var(--muted);font-style:italic}
#info .sym{margin:10px 0;padding:8px 12px;background:#fff4d6;border-left:4px solid var(--gold);border-radius:6px;font-weight:600}
#info h3{font-size:15px;margin:16px 0 6px;color:var(--red);text-transform:uppercase;letter-spacing:.04em}
.ph{padding:8px 0;border-top:1px solid var(--line)}
.ph b{display:block}.ph i{color:var(--muted);font-size:14px}
.close{position:absolute;top:10px;right:12px;border:0;background:#0001;border-radius:50%;width:34px;height:34px;font-size:20px;cursor:pointer}
#cbExit{display:none;position:absolute;top:12px;left:50%;transform:translateX(-50%);border:0;border-radius:999px;padding:10px 18px;font:inherit;font-weight:700;background:#000a;color:#fff;cursor:pointer}
body.cb header,body.cb .views,body.cb .parts,body.cb .bar,body.cb .hint,body.cb .credit,body.cb #info,body.cb #VRButton,body.cb #toast{display:none!important}
body.cb main{height:100%!important}
body.cb #model>a{display:none!important}
body.cb #cbExit{display:block}
.doc{max-width:980px;margin:0 auto;padding:28px 16px 60px}
.doc h1{font-size:30px;margin:0 0 6px}
.doc h2{margin-top:32px;color:var(--nav)}
.lead{color:var(--muted);font-size:18px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;margin:12px 0}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--nav);color:#fff;font-weight:600}
td.kz{font-weight:700}
.bad{color:#b3261e}.good{color:#1b7a3a;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.tile{background:#fff;border-radius:12px;padding:14px;border-top:4px solid var(--gold)}
.tile b{display:block;font-size:18px}
.tablewrap{overflow-x:auto}
@media (max-width:760px){
 header{height:auto;flex-wrap:wrap;padding:8px 16px;gap:8px}.brand{width:calc(100% - 140px)}.brand small{display:none}
 .langs{margin-left:auto}
 nav{margin-left:0;width:100%;overflow-x:auto;order:3}
 main{height:calc(100% - 100px)}
 .parts,.hint,.credit{display:none}
 #VRButton{top:62px!important}
 #info{top:auto;bottom:70px;height:52%;right:16px;left:16px;width:auto}
 .bar button{padding:10px 12px;font-size:14px}
 .pill{padding:8px 12px;font-size:14px}
}
</style>

</head>

</main>

function wrap(x,text,X,Y,maxW,lh){let line='';for(const w of text.split(' ')){const s=line?line+' '+w:w;if(x.measureText(s).width>maxW&&line){x.fillText(line,X,Y);Y+=lh;line=w;}else line=s;}if(line){x.fillText(line,X,Y);Y+=lh;}return Y;}
function drawPanel(title,sub,sym,body,phr){const{c,tx}=vrPanel,x=c.getContext('2d'),F='"Segoe UI",Roboto,sans-serif';x.clearRect(0,0,1024,1280);
 x.fillStyle='#fffdf8';x.beginPath();x.roundRect(0,0,1024,1280,48);x.fill();
 let y=110;x.fillStyle='#16244a';x.font='bold 68px '+F;x.fillText(title,56,y);y+=62;
 x.fillStyle='#5d6472';x.font='italic 38px '+F;y=wrap(x,sub,56,y,912,46)+10;
 if(sym){x.fillStyle='#fff4d6';x.fillRect(56,y-10,912,66);x.fillStyle='#1f2430';x.font='bold 32px '+F;x.fillText(sym,76,y+34);y+=92;}
 x.fillStyle='#1f2430';x.font='33px '+F;y=wrap(x,body,56,y+10,912,43)+18;
 for(const p of phr){if(y>1190)break;x.fillStyle='#9b1c1c';x.font='bold 35px '+F;x.fillText(p[0],56,y+10);y+=50;x.fillStyle='#1f2430';x.font='30px '+F;y=wrap(x,'— '+p[2][L],56,y,912,38)+12;}
 x.fillStyle='#5d6472';x.font='26px '+F;x.fillText(t('close_xr'),56,1250);tx.needsUpdate=true;}
function showPanel(){if(cb)cbTick();const m=vrPanel.m,cam=headCam(),p=new THREE.Vector3(),q=new THREE.Quaternion();cam.getWorldPosition(p);cam.getWorldQuaternion(q);
 const dir=new THREE.Vector3(0,0,-1).applyQuaternion(q);dir.y=0;dir.normalize();m.position.copy(p).addScaledVector(dir,1.1);m.position.y=p.y-.05;m.lookAt(p.x,m.position.y,p.z);m.visible=true;}
function vrInfo(key){if(!renderer.xr.isPresenting&&!cb)return;if(!key){vrPanel.m.visible=false;return;}const d=INFO[key];drawPanel(d.kz,d.lat+' — '+d.name[L],d.sym[L],d.desc[L],d.phr);showPanel();}
function welcome(bodyKey){drawPanel(t('w_title'),t('w_sub'),null,t(bodyKey),[]);showPanel();}
const vrTargets=[...Object.values(parts).map(p=>p.group),ground,floorMesh,vrPanel.m];
const marker=new THREE.Mesh(new THREE.RingGeometry(.18,.25,32),new THREE.MeshBasicMaterial({color:0x2b5fd9}));marker.rotation.x=-Math.PI/2;marker.visible=false;scene.add(marker);
const reticle=new THREE.Mesh(new THREE.RingGeometry(.008,.014,24),new THREE.MeshBasicMaterial({color:0xffffff,depthTest:false}));reticle.position.z=-.8;reticle.renderOrder=999;reticle.visible=false;camera.add(reticle);
const cbPos=new THREE.Vector3(0,0,5.5);
function vrHandle(h){if(!h){if(vrPanel.m.visible)select(null);return;}
 if(h.object===vrPanel.m){select(null);return;}
 const k=h.object.userData.part;if(k){select(k);return;}
 if(h.object===ground||h.object===floorMesh){vrPanel.m.visible=false;
  if(cb){cbPos.set(h.point.x,0,h.point.z);return;}
  const p=new THREE.Vector3();headCam().getWorldPosition(p);rig.position.x+=h.point.x-p.x;rig.position.z+=h.point.z-p.z;}}

/* ---------- headset (WebXR) ---------- */
const cmf=new XRControllerModelFactory(),ctrls=[],tmpM=new THREE.Matrix4();
for(let i=0;i<2;i++){const c=renderer.xr.getController(i);
 const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3(0,0,-1)]),new THREE.LineBasicMaterial({color:0xffc400}));line.scale.z=8;c.add(line);
 c.addEventListener('connected',e=>{line.visible=e.data.targetRayMode!=='screen';});
 c.addEventListener('selectstart',()=>vrHandle(ctrlHit(c)));
 c.addEventListener('squeezestart',()=>exploded?assemble():disassemble());
 rig.add(c);const g=renderer.xr.getControllerGrip(i);g.add(cmf.createControllerModel(g));rig.add(g);ctrls.push(c);}
function ctrlHit(c){tmpM.identity().extractRotation(c.matrixWorld);ray.ray.origin.setFromMatrixPosition(c.matrixWorld);ray.ray.direction.set(0,0,-1).applyMatrix4(tmpM);ray.far=40;return ray.intersectObjects(vrTargets,true).find(h=>h.object.visible);}
function rotateRig(a){const p=new THREE.Vector3();headCam().getWorldPosition(p);rig.position.sub(p).applyAxisAngle(UP,a).add(p);rig.rotation.y+=a;}
let turned=false;
function groundMarker(h){if(h&&(h.object===ground||h.object===floorMesh)){marker.position.set(h.point.x,h.point.y+.02,h.point.z);marker.visible=true;return true;}return false;}
function vrTick(dt){const s=renderer.xr.getSession();if(!s)return;const q=new THREE.Quaternion();headCam().getWorldQuaternion(q);
 const fwd=new THREE.Vector3(0,0,-1).applyQuaternion(q);fwd.y=0;fwd.normalize();const right=new THREE.Vector3(-fwd.z,0,fwd.x);
 for(const src of s.inputSources){const gp=src.gamepad;if(!gp||gp.axes.length<4)continue;const ax=gp.axes[2],ay=gp.axes[3];
  if(src.handedness==='right'){if(Math.abs(ax)>.6){if(!turned){rotateRig(-Math.sign(ax)*Math.PI/6);turned=true;}}else turned=false;}
  else if(Math.abs(ax)>.15||Math.abs(ay)>.15){rig.position.addScaledVector(fwd,-ay*dt*1.5).addScaledVector(right,ax*dt*1.5);}}
 marker.visible=false;for(const c of ctrls)if(groundMarker(ctrlHit(c)))break;}
renderer.xr.addEventListener('sessionstart',()=>{controls.enabled=false;camT=null;clearTimers();select(null);
 rig.position.set(0,0,5.5);rig.rotation.set(0,0,0);inner.intensity=3;setTimeout(()=>welcome('w_xr'),400);});
renderer.xr.addEventListener('sessionend',()=>{controls.enabled=true;vrPanel.m.visible=false;marker.visible=false;rig.position.set(0,0,0);rig.rotation.set(0,0,0);
 camera.position.copy(HOME.p);controls.target.copy(HOME.t);setView('out');});

/* ---------- phone VR glasses (stereo + gyroscope) ---------- */
const qDev=new THREE.Quaternion(),qYaw=new THREE.Quaternion(),qT=new THREE.Quaternion(),zee=new THREE.Vector3(0,0,1),q1=new THREE.Quaternion(-Math.sqrt(.5),0,0,Math.sqrt(.5)),eul=new THREE.Euler();
let gyro=false,yawInit=false;
function onOri(e){if(e.alpha==null)return;const D=THREE.MathUtils.DEG2RAD;eul.set(e.beta*D,e.alpha*D,-e.gamma*D,'YXZ');
 const so=(screen.orientation&&screen.orientation.angle)||window.orientation||0;
 qDev.setFromEuler(eul).multiply(q1).multiply(qT.setFromAxisAngle(zee,-so*D));
 if(!yawInit){qYaw.setFromAxisAngle(UP,-new THREE.Euler().setFromQuaternion(qDev,'YXZ').y);yawInit=true;}gyro=true;}
async function enterCB(){
 try{if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function')await DeviceOrientationEvent.requestPermission();}catch(e){}
 try{await document.documentElement.requestFullscreen?.();}catch(e){}
 try{await screen.orientation?.lock?.('landscape');}catch(e){}
 select(null);clearTimers();camT=null;stopRotate();
 if(exploded){ASM.forEach(k=>parts[k].target=0);exploded=false;$('bExp').classList.remove('on');}
 cb=true;document.body.classList.add('cb');gyro=false;yawInit=false;yaw=0;pitch=0;window.addEventListener('deviceorientation',onOri);
 controls.enabled=false;cbPos.set(0,0,5.5);camera.fov=80;camera.updateProjectionMatrix();reticle.visible=true;inner.intensity=3;
 setTimeout(()=>welcome('w_cb'),500);}
function exitCB(){if(!cb)return;cb=false;document.body.classList.remove('cb');window.removeEventListener('deviceorientation',onOri);
 reticle.visible=false;marker.visible=false;vrPanel.m.visible=false;select(null);camera.fov=45;camera.updateProjectionMatrix();
 controls.enabled=true;camera.position.copy(HOME.p);controls.target.copy(HOME.t);
 if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});try{screen.orientation?.unlock?.();}catch(e){}setView('out');}
window.yurt={vrPanel,camera,scene,ray,vrTargets};
$('bCB').onclick=enterCB;$('cbExit').onclick=exitCB;
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&cb)exitCB();});
function cbTick(){camera.position.set(cbPos.x,1.6,cbPos.z);
 if(gyro)camera.quaternion.copy(qYaw).multiply(qDev);else camera.quaternion.setFromEuler(new THREE.Euler(pitch,yaw,0,'YXZ'));
 camera.updateMatrixWorld();ray.setFromCamera(new THREE.Vector2(0,0),camera);ray.far=40;marker.visible=false;groundMarker(ray.intersectObjects(vrTargets,true).find(h=>h.object.visible));}

/* ================= PAGES + LANGUAGE ================= */
function renderPages(){
 const P1=PHRP[L];
 $('phrDoc').innerHTML=`<h1>${P1.title}</h1><p class="lead">${P1.lead}</p>`+ORDER.filter(k=>INFO[k].phr.length).map(k=>{const d=INFO[k];
  return `<h2>${d.kz} · ${d.lat} <small style="font-weight:400;color:var(--muted)">(${d.name[L]})</small></h2><div class="tablewrap"><table><tr>${P1.head.map(h=>`<th>${h}</th>`).join('')}</tr>${d.phr.map(p=>`<tr><td class="kz">${p[0]}</td><td><i>${p[1]}</i></td><td>${p[2][L]}</td></tr>`).join('')}</table></div>`;}).join('');
 const P2=TRP[L];
 $('trDoc').innerHTML=`<h1>${P2.title}</h1><p class="lead">${P2.lead}</p><div class="tablewrap"><table><tr>${P2.head.map(h=>`<th>${h}</th>`).join('')}</tr>`+
  TRROWS.map((r,i)=>`<tr><td>${i+1}</td><td class="kz">${r[0]}<br><i>${r[1]}</i></td><td class="bad">${r[2]}</td><td class="good">${r[3]}</td><td>${r[4][L]}</td></tr>`).join('')+
  `</table></div><h2>${P2.sh}</h2><div class="grid">${P2.st.map(s=>`<div class="tile"><b>${s[0]}</b>${s[1]}</div>`).join('')}</div>`;
 const A=ABOUT[L],C=CREDIT[L];
 $('aboutDoc').innerHTML=`<h1>${A.title}</h1><p class="lead">${A.lead}</p><div class="tile" style="margin-top:14px"><b>${C[0]}</b>${C[1]}</div>`+
  `<h2>${A.h[0]}</h2><p>${A.problem}</p><h2>${A.h[1]}</h2><p>${A.aim}</p>`+
  `<h2>${A.h[2]}</h2><div class="grid">${A.methods.map(m=>`<div class="tile"><b>${m[0]}</b>${m[1]}</div>`).join('')}</div>`+
  `<h2>${A.h[3]}</h2><div class="grid">${A.concl.map(m=>`<div class="tile"><b>${m[0]}</b>${m[1]}</div>`).join('')}</div><p>${A.closing}</p>`+
  `<h2>${A.h[4]}</h2><p>${A.schol}</p>`;
 $('credit').innerHTML=C[0]+'<br>'+C[1];}
function applyLang(){document.documentElement.lang=L==='kz'?'kk':L;document.title=t('title');
 document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
 document.querySelectorAll('.langs button').forEach(b=>b.classList.toggle('on',b.dataset.l===L));
 renderPages();if(selected)select(selected);}
document.querySelectorAll('.langs button').forEach(b=>b.onclick=()=>{L=b.dataset.l;try{localStorage.setItem('yurtLang',L);}catch(e){}applyLang();});
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
 document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id===b.dataset.page));resize();});
applyLang();

/* ================= LOOP ================= */
function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(canvas);resize();
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),.05);
 for(const k in parts){const p=parts[k],d=p.target-p.t;p.t+=Math.sign(d)*Math.min(Math.abs(d),dt*1.3);const e=ease(p.t);
  p.group.position.copy(p.offset).multiplyScalar(e);if(p.scale){const s=1+(p.scale-1)*e;p.group.scale.set(s,1,s);}}
 if(renderer.xr.isPresenting){vrTick(dt);renderer.render(scene,camera);return;}
 if(cb){cbTick();stereo.render(scene,camera);return;}
 if(camT){camT.k=Math.min(1,camT.k+dt/camT.d);const e=ease(camT.k);camera.position.lerpVectors(camT.p0,camT.p1,e);controls.target.lerpVectors(camT.t0,camT.t1,e);
  if(camT.k>=1){const f=camT.done;camT=null;f&&f();}}
 controls.update();renderer.render(scene,camera);});
</script>
